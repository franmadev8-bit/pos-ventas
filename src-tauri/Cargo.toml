[package]
name = "pos-ventas"
version = "0.1.0"
description = "Punto de venta para comercios minoristas"
authors = ["Francisco Martinez"]
edition = "2021"

[lib]
name = "pos_ventas_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Misma version que arrastra tauri-plugin-sql (0.8.6): los comandos toman
# prestado SU pool, asi que los tipos tienen que unificar. No abre ninguna
# conexion propia ni agrega otra copia de SQLite al binario.
sqlx = { version = "0.8", default-features = false, features = ["sqlite", "runtime-tokio"] }
